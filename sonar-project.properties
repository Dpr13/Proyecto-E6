sonar.projectKey=Dpr13_Proyecto-E6
sonar.organization=dpr13

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=Proyecto-E6
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=my-react-app/src,backend
sonar.exclusions=**/node_modules/**,**/*.test.jsx,**/*.test.js,**/*.spec.js,**/*.spec.jsx,**/setupTests.js,**/*.config.js,**/coverage/**,**/dist/**,**/build/**

# Test coverage
sonar.javascript.lcov.reportPaths=my-react-app/coverage/lcov.info
sonar.coverage.exclusions=**/*.test.jsx,**/*.test.js,**/*.spec.js,**/*.spec.jsx,**/setupTests.js,**/*.config.js

# Tests
sonar.tests=my-react-app/src
sonar.test.inclusions=**/*.test.jsx,**/*.test.js,**/*.spec.js,**/*.spec.jsx

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8